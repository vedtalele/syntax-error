<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Crumb · Pirate Cove</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171611" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: left rail nav on desktop, bottom tab bar on phones. One content column per view. Oven-orange for action and urgency, gold for coins, four branch hues for skills. */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#0F1626; --ink2:#465068; --ink3:#6B7488;
  --line:#E0E5EE; --line2:#CBD3E0;
  --accent:#D9480F; --accent-ink:#FFFFFF; --accent-soft:#FFEFE6;
  --coin:#E8A200; --coin-soft:#FFF5D6; --coin-ink:#6F4B00;
  --ok:#0B8A6F; --ok-soft:#E1F5EF; --bad:#C92A2A; --bad-soft:#FCEAEA;
  --b1:#2F6FEB; --b2:#D6336C; --b3:#7048E8; --b4:#0B8A6F; --on-b:#FFFFFF;
  --shadow:0 1px 2px rgba(15,22,38,.05),0 6px 20px rgba(15,22,38,.05);
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1D; --surface:#121930; --surface2:#172040; --ink:#EDF0F7; --ink2:#A7B0C6; --ink3:#8791A9;
  --line:#242E4B; --line2:#34405F;
  --accent:#FF7A3D; --accent-ink:#1B0B03; --accent-soft:#2D1A10;
  --coin:#F5B82E; --coin-soft:#2C2510; --coin-ink:#F7CB62;
  --ok:#2DD4A8; --ok-soft:#10322B; --bad:#FF6B6B; --bad-soft:#35171A;
  --b1:#6D9DFF; --b2:#FF7AA8; --b3:#A58BFF; --b4:#2DD4A8; --on-b:#0A0F1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1D; --surface:#121930; --surface2:#172040; --ink:#EDF0F7; --ink2:#A7B0C6; --ink3:#8791A9;
  --line:#242E4B; --line2:#34405F;
  --accent:#FF7A3D; --accent-ink:#1B0B03; --accent-soft:#2D1A10;
  --coin:#F5B82E; --coin-soft:#2C2510; --coin-ink:#F7CB62;
  --ok:#2DD4A8; --ok-soft:#10322B; --bad:#FF6B6B; --bad-soft:#35171A;
  --b1:#6D9DFF; --b2:#FF7AA8; --b3:#A58BFF; --b4:#2DD4A8; --on-b:#0A0F1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:228px minmax(0,1fr);gap:32px;padding-block:20px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:22px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:25px;letter-spacing:-.03em}
.logo svg{width:34px;height:34px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:none;color:var(--ink2);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.quest{border:1px dashed var(--line2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.quest .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.quest b{font-family:var(--f-disp);font-size:15px;line-height:1.25}
.quest.done{border-style:solid;background:var(--ok-soft)}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:0;background:none;text-align:left;width:100%}
.me:hover{background:var(--surface)}
.me small{display:block;color:var(--ink3);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--b3);color:var(--on-b);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px;flex:none}

.main{min-width:0;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top .mlogo{display:none}
.top .ttl{flex:1;min-width:200px}
.top h1{font-size:30px;font-weight:700;line-height:1.1}
.top p{color:var(--ink2);margin-top:4px}
.chips{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.coin{background:var(--coin-soft);border-color:transparent;color:var(--coin-ink)}
.chip small{font-weight:500;color:inherit;opacity:.8}

.tabbar{display:none}
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-block:14px}
  .side{display:none}
  .top .mlogo{display:flex}
  .top .ttl{order:3;flex-basis:100%}
  .top h1{font-size:26px}
  .chips{margin-left:auto}
  .chip small{display:none}
  .main{padding-bottom:96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:6px}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--ink3);font-size:12px;font-weight:600;padding:6px 4px;border-radius:10px}
  .tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn:disabled{opacity:.62;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.icon{padding:8px;border-radius:9px}

/* board */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding:26px;border-radius:20px;background:var(--ink);color:var(--bg)}
.hero .live{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;opacity:.92;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.hero h2{font-size:clamp(24px,3.2vw,36px);line-height:1.08;font-weight:700}
.hero h2 em{font-style:normal;color:var(--accent)}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;font-size:14px;line-height:1.4}
.steps .n{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--bg) 16%,transparent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.steps b{display:block;font-family:var(--f-disp);font-size:15px}
.steps span{opacity:.78}
@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr);padding:20px}}
.bar-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fc{padding:7px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink2)}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.fc small{font-family:var(--f-mono);margin-left:4px;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.card{--k:var(--ink2);display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--line2)}
.k-design{--k:var(--b2)}.k-frontend{--k:var(--b1)}.k-backend{--k:var(--b4)}.k-copy{--k:var(--b3)}.k-qa{--k:var(--ink2)}
.c-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:auto}
.badge.surge{background:var(--accent-soft);color:var(--accent)}
.badge.new{background:var(--ok-soft);color:var(--ok)}
.card h3{font-size:19px;line-height:1.2;font-weight:650}
.desc{color:var(--ink2);font-size:14px}
.skills{display:flex;gap:6px;flex-wrap:wrap}
.sk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.sk.lock{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.sk.crit{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay div{padding:9px 12px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;gap:1px}
.pay div.win{background:var(--coin-soft);color:var(--coin-ink)}
.pay small{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.pay b{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:18px;font-weight:600}
.pay em{font-style:normal;font-size:12px;font-family:var(--f-body);font-weight:600;opacity:.85}
.clock{display:flex;flex-direction:column;gap:7px}
.clock .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.clock .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1}
.clock .l{font-size:12px;color:var(--ink3);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.clock.urgent .t{color:var(--bad)}
.clock.urgent .bar i{background:var(--bad)}
.claims{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.pips{display:flex}
.pip{width:26px;height:26px;border-radius:50%;margin-left:-6px;border:2px solid var(--surface);display:grid;place-items:center;font-size:9.5px;font-weight:700;background:var(--pc,var(--b1));color:var(--on-b)}
.pip:first-child{margin-left:0}
.pip.empty{background:var(--surface2);border:1.5px dashed var(--line2);color:transparent}
.pip.you{background:var(--accent);color:var(--accent-ink)}
.claims .txt{font-size:13px;color:var(--ink2);font-weight:600}
.acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px}

/* upload */
.up{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:1100px){.up{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:19px;font-weight:650}
.panel .sub{color:var(--ink2);font-size:14px;margin-top:2px}
label.lb{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line2);background:var(--surface2);border-radius:12px;padding:11px 13px;line-height:1.5}
textarea{resize:vertical;min-height:170px}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.rowb{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--ink3)}
.field{display:flex;flex-direction:column;gap:8px}
.poolrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}
.sumbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumbox div{padding:10px 12px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;gap:2px}
.sumbox small{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.sumbox b{font-family:var(--f-mono);font-size:16px;font-weight:600}
.warn{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:600}
.okmsg{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:13.5px;font-weight:600}
.planhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.pill.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:6px}
.gwrap svg{display:block;min-width:700px;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);font-weight:600}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.n{border-top:2px solid var(--line2)}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.trow .ti{display:flex;align-items:center;gap:10px;min-width:0}
.trow .ti i{width:9px;height:9px;border-radius:3px;background:var(--k);flex:none}
.trow input{border:0;background:none;padding:4px 6px;font-weight:600;border-radius:8px}
.trow input:hover{background:var(--surface2)}
.trow .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink3)}
.trow .rw{font-family:var(--f-mono);font-size:13px;color:var(--coin-ink);background:var(--coin-soft);padding:2px 8px;border-radius:7px;font-weight:600}
.trow .ctl{display:flex;gap:4px}
.skel{display:flex;flex-direction:column;gap:10px}
.skel i{display:block;height:44px;border-radius:12px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.pop{animation:pop .4s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.scan{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:10px;font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--accent);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.gsvg text{fill:var(--ink);font-family:var(--f-body)}
.gsvg .m{fill:var(--ink3);font-size:11px;font-weight:500}
.gsvg .t{font-size:12.5px;font-weight:650}
.gsvg .nd{fill:var(--surface);stroke:var(--line2);stroke-width:1.5}
.gsvg .nd.c{stroke:var(--accent);stroke-width:2}
.gsvg .e{fill:none;stroke:var(--line2);stroke-width:1.8}
.gsvg .e.c{stroke:var(--accent);stroke-width:3}
.gsvg marker path{fill:var(--line2)}
.gsvg marker.cm path{fill:var(--accent)}

/* profile */
.phero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:24px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .av{position:absolute;inset:11px;width:auto;height:auto;font-size:26px}
.lvl{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;font-family:var(--f-mono)}
.phero h2{font-size:28px;margin:8px 0 2px}
.xp{margin-top:12px;max-width:440px}
.xp .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.xp .bar{height:10px}
.xp .bar i{background:var(--accent)}
.phero .right{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.verified{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:600;justify-content:center}
@media (max-width:760px){.phero{grid-template-columns:auto minmax(0,1fr)}.phero .right{grid-column:1/-1}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.stats div{padding:16px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stats div:first-child{border-left:0}
.stats small{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.stats b{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.2}
.stats span{font-size:12.5px;color:var(--ink2)}

function analyse(plan){
  var idx={};plan.forEach(function(t,i){idx[t.id]=i});
  var lvl=[],par=[],dist=[];
  plan.forEach(function(t,i){var l=0,best=0,p=-1;t.deps.forEach(function(d){var j=idx[d];if(j===undefined)return;l=Math.max(l,lvl[j]+1);if(dist[j]>best){best=dist[j];p=j}});lvl[i]=l;dist[i]=best+t.eff;par[i]=p});
  var end=0;dist.forEach(function(d,i){if(d>dist[end])end=i});
  var crit={},c=end;while(c>=0&&plan.length){crit[c]=1;c=par[c]}
  return {idx:idx,lvl:lvl,crit:crit,total:plan.length?dist[end]:0,steps:Object.keys(crit).length};
}

  var slug=state.chatFor;
  setTimeout(function(){
    var s=state.subs[t.id];

    if(c){
      seedChat(c);pushMsg(c.key,'them','I have reviewed your submission and accepted it. Nice work. I will pick the winner when the timer ends.');saveChat();

    notify({type:'accepted',title:'Your work was accepted',body:who+' accepted your submission for "'+t.title+'". You are in the running for the '+num(prize)+' crumb winner prize.',view:'work'});

<script>
(function(){
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var view=document.getElementById('view'),lastSig='',flag=false;
function sig(){var c=view.firstElementChild;return c?c.className:''}
function tween(el,to,ms){
  if(reduce){return}
  var t0=performance.now(),fmt=function(n){return Math.round(n).toLocaleString('en-US')};
  (function f(t){var p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)})(t0);
}
function after(){
  var s=sig(),changed=s!==lastSig||flag;lastSig=s;flag=false;
  if(!changed||reduce)return;
  var i=0;view.querySelectorAll('.hero,.bar-tools,.card,.panel,.stats,.phero,.pgrid>div').forEach(function(el){
    if(el.classList.contains('pop'))return;
    el.style.animationDelay=Math.min(i++,10)*40+'ms';el.classList.add('rise')});
  view.querySelectorAll('.xp .bar i,.detail .bar i').forEach(function(b){
    var w=b.style.width;b.style.width='0%';requestAnimationFrame(function(){requestAnimationFrame(function(){b.style.width=w})})});
  view.querySelectorAll('.stats b').forEach(function(b){
    var n=b.querySelector('span')||b,v=n.textContent.replace(/,/g,'');
    if(/^\d+$/.test(v))tween(n,+v,800)});
}
new MutationObserver(after).observe(view,{childList:true});
document.addEventListener('click',function(e){
  if(e.target.closest('[data-act="filter"],[data-act="sort"]'))flag=true;
},true);
after();

/* floating deltas on balance and rep */
var last={bal:null,rep:null};
function watch(id,suffix){
  var el=document.getElementById(id);if(!el)return;
  var v=+el.textContent.replace(/,/g,'');
  if(last[id]!==null&&v!==last[id]&&!reduce){
    var d=v-last[id],r=el.getBoundingClientRect(),f=document.createElement('div');
    f.className='floater '+(d>0?'up':'down');f.textContent=(d>0?'+':'\u2212')+Math.abs(d).toLocaleString('en-US')+suffix;
    f.style.left=(r.left)+'px';f.style.top=(r.top+r.height)+'px';document.body.appendChild(f);setTimeout(function(){f.remove()},1000);
    var chip=el.closest('.chip');if(chip){chip.classList.remove('bump');void chip.offsetWidth;chip.classList.add('bump')}
  }
  last[id]=v;
}
setInterval(function(){watch('bal','');watch('rep',' rep')},150);
})();

<div id="login" role="dialog" aria-modal="true" aria-labelledby="lgTitle" hidden></div>
<script>
(function(){
var root=document.getElementById('login'),mem={},mode='in';
function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return mem[k]||null}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
function del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
function hash(p){
  if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)).then(function(b){return [].map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')});
  return Promise.resolve(btoa(unescape(encodeURIComponent(p))));
}
function mk(n){var w=n.trim().split(/\s+/).filter(Boolean);return {n:n.trim(),i:(w.length>1?w[0][0]+w[w.length-1][0]:(w[0]||'?').slice(0,2)).toUpperCase(),s:n.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'builder'}}
function inert(on){['.shell','#tabbar'].forEach(function(q){var e=document.querySelector(q);if(e){on?e.setAttribute('inert',''):e.removeAttribute('inert')}})}
function enter(u,remember){
  window.CRUMB_USER=u;if(remember)put('crumb_session',u);
  root.classList.add('out');
  setTimeout(function(){root.hidden=true;root.classList.remove('out');root.innerHTML='';inert(false);if(window.__crumbRender)window.__crumbRender();window.scrollTo(0,0)},250);
}
function draw(){
  var up=mode==='up';
  root.innerHTML='<section class="lg-art"><div class="logo"><svg width="34" height="34" aria-hidden="true"><use href="#logo"/></svg>Crumb</div>'+
  '<h1>Small tasks, real work, <em>a record you own.</em></h1>'+
  '<ol><li><b>01</b>Claim a task from the board</li><li><b>02</b>Submit before the timer runs out</li><li><b>03</b>Earn crumbs and verified skill XP</li></ol></section>'+
  '<main class="lg-form"><div class="lg-box"><h2 id="lgTitle">'+(up?'Create your account':'Sign in')+'</h2><p class="sub">'+(up?'It takes under a minute.':'Welcome back. Pick up where you left off.')+'</p>'+
  (up?'<div class="f"><label class="lb" for="lgName" style="margin:0">Full name</label><input type="text" id="lgName" autocomplete="name" placeholder="e.g. Sameer Kumar"></div>':'')+
  '<div class="f"><label class="lb" for="lgMail" style="margin:0">Email</label><input type="text" id="lgMail" inputmode="email" autocomplete="email" placeholder="you@college.edu"></div>'+
  '<div class="f"><label class="lb" for="lgPass" style="margin:0">Password</label><div class="pw"><input type="password" id="lgPass" autocomplete="'+(up?'new-password':'current-password')+'" placeholder="At least 6 characters"><button type="button" id="lgShow" aria-label="Show password">Show</button></div></div>'+
  '<div class="lg-err" id="lgErr" role="alert"></div>'+
  '<button class="btn primary" id="lgGo" type="button">'+(up?'Create account':'Sign in')+'</button>'+
  '<div class="lg-alt"><span>'+(up?'Already have an account? ':'New here? ')+'<button type="button" id="lgMode">'+(up?'Sign in':'Create account')+'</button></span><button type="button" id="lgGuest">Continue as guest</button></div>'+
  '<p class="lg-note">Accounts are stored only in this browser. There is no server, so this is a demo sign-in.</p></div></main>';
  var f=document.getElementById(up?'lgName':'lgMail');if(f)f.focus();
}
function show(){mode='in';root.hidden=false;root.classList.remove('out');inert(true);draw()}
function err(m){var e=document.getElementById('lgErr');if(e)e.textContent=m}
function submit(){
  var up=mode==='up',name=up?document.getElementById('lgName').value.trim():'',mail=document.getElementById('lgMail').value.trim().toLowerCase(),pw=document.getElementById('lgPass').value;
  if(up&&name.length<2)return err('Enter your name.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return err('Enter a valid email address.');
  if(pw.length<6)return err('Password needs at least 6 characters.');
  var users=get('crumb_users')||{};
  hash(pw).then(function(h){
    if(up){
      if(users[mail])return err('That email already has an account. Sign in instead.');
      users[mail]={n:name,h:h};put('crumb_users',users);enter(mk(name),true);
    }else{
      var a=users[mail];
      if(!a)return err('No account for that email yet. Choose Create account.');
      if(a.h!==h)return err('That password does not match.');
      enter(mk(a.n),true);
    }
  });
}
root.addEventListener('click',function(e){
  var id=e.target.id;
  if(id==='lgGo')submit();
  else if(id==='lgMode'){mode=mode==='in'?'up':'in';draw()}
  else if(id==='lgGuest')enter(mk('Guest Builder'),false);
  else if(id==='lgShow'){var p=document.getElementById('lgPass'),h=p.type==='password';p.type=h?'text':'password';e.target.textContent=h?'Hide':'Show';e.target.setAttribute('aria-label',h?'Hide password':'Show password')}
});
root.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT')submit()});
root.addEventListener('input',function(){err('')});

/* sign out buttons injected into the shell */
function addOut(host,after){
  if(!host||host.querySelector('.signout'))return;
  var b=document.createElement('button');b.className='signout';b.type='button';b.textContent='Sign out';b.setAttribute('data-signout','1');
  host.appendChild(b);
}
function sync(){}
['side','top'].forEach(function(id){new MutationObserver(sync).observe(document.getElementById(id),{childList:true})});
document.addEventListener('click',function(e){if(e.target.closest('[data-signout]')){del('crumb_session');window.CRUMB_USER=null;show()}});

var sess=get('crumb_session');
if(sess&&sess.n){window.CRUMB_USER=sess;if(window.__crumbRender)window.__crumbRender();sync()}
else{show()}
sync();
})();

<script>
(function(){
if(!matchMedia('(hover:hover)').matches)return;
var veil=document.createElement('div'),ft=document.createElement('div'),src=null,raf=0,hideT=0;
veil.className='fv';ft.className='ft';ft.setAttribute('aria-hidden','true');veil.setAttribute('aria-hidden','true');
document.body.appendChild(veil);document.body.appendChild(ft);
function loop(){
  if(!src||!document.body.contains(src)){return stop()}
  var r=src.getBoundingClientRect();
  ft.style.left=r.left+'px';ft.style.top=r.top+'px';
  ft.firstChild.textContent=src.textContent;
  ft.classList.toggle('urgent',!!src.closest('.clock.urgent'));
  raf=requestAnimationFrame(loop);
}
function start(t){
  clearTimeout(hideT);src=t;
  ft.innerHTML='<span></span><small>left in sprint</small>';
  ft.classList.remove('on');ft.classList.add('show');
  t.closest('.clock').classList.add('fhide');
  veil.classList.add('on');
  loop();
  requestAnimationFrame(function(){requestAnimationFrame(function(){ft.classList.add('on')})});
}
function stop(){
  cancelAnimationFrame(raf);
  if(src){var c=src.closest('.clock');if(c)c.classList.remove('fhide')}
  src=null;ft.classList.remove('on','show');veil.classList.remove('on');
  document.querySelectorAll('.clock.fhide').forEach(function(c){c.classList.remove('fhide')});
}

  var t=e.target.closest&&e.target.closest('.clock .t');
  if(t&&t!==src)start(t);
});
document.addEventListener('mouseout',function(e){
  if(!src)return;
  var t=e.target.closest&&e.target.closest('.clock .t');
  if(t===src&&!(e.relatedTarget&&src.contains(e.relatedTarget)))stop();
});

})();
</script>

(function(){
var n=47,view=document.getElementById('view');
function put(){
  var h=view.querySelector('.hero>div');
  if(!h||h.querySelector('.live'))return;
  var d=document.createElement('div');d.className='live';
  d.innerHTML='<i class="dot"></i><span><b class="mono" id="liveN">'+n+'</b> builders are working on tasks right now</span>';
  h.insertBefore(d,h.firstChild);
}
new MutationObserver(put).observe(view,{childList:true});put();
setInterval(function(){
  n=Math.max(31,Math.min(68,n+Math.round(Math.random()*4-2)));

},3500);
})();
